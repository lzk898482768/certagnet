# 证照到期管理系统 —— 飞牛 fnOS 阿里云 ACR 部署编排（可选）
#
# 与 docker-compose.yml 的区别：所有镜像都从阿里云 ACR 拉取，不在飞牛本地构建。
# 适合飞牛访问 Docker Hub 很慢、或希望固定镜像版本的场景。
#
# 前提：
#   1. 在能访问 Docker Hub 的构建机上执行 tools/push-acr.sh，推送 php/mysql/redis/app
#   2. 在飞牛上 docker login 阿里云 ACR
#   3. .env 中设置 ACR_REGISTRY / ACR_NAMESPACE / ACR_TAG
#
# 启动：
#   docker compose -f docker-compose.acr.yml --env-file .env up -d
#
# 升级：
#   构建机重新 push 新 ACR_TAG；飞牛上把 .env 的 ACR_TAG 改成新版本，再执行
#   docker compose -f docker-compose.acr.yml pull
#   docker compose -f docker-compose.acr.yml up -d

services:
  mysql:
    image: ${ACR_REGISTRY:-crpi-e8ivxiujwrjswkb4.cn-beijing.personal.cr.aliyuncs.com}/${ACR_NAMESPACE:-certagent}/mysql:${MYSQL_TAG:-8.0}
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      # 性能调优（4GB NAS 基线，全部可在 .env 用 MYSQL_* 覆盖，高规格 NAS 调大即可）
      - --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-268435456}
      - --innodb-log-file-size=${MYSQL_INNODB_LOG_FILE_SIZE:-134217728}
      - --innodb-flush-log-at-trx-commit=${MYSQL_INNODB_FLUSH_LOG_AT_TRX_COMMIT:-1}
      - --max-connections=${MYSQL_MAX_CONNECTIONS:-100}
      - --table-open-cache=${MYSQL_TABLE_OPEN_CACHE:-1000}
      - --tmp-table-size=${MYSQL_TMP_TABLE_SIZE:-33554432}
      - --max-heap-table-size=${MYSQL_MAX_HEAP_TABLE_SIZE:-33554432}
      - --slow-query-log=${MYSQL_SLOW_QUERY_LOG:-1}
      - --long-query-time=${MYSQL_LONG_QUERY_TIME:-2}
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?请在 .env 中设置 DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-cert_agent_fnos}
      # 允许应用容器以 root 连接；数据库端口不对宿主机暴露
      MYSQL_ROOT_HOST: "%"
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  redis:
    image: ${ACR_REGISTRY:-crpi-e8ivxiujwrjswkb4.cn-beijing.personal.cr.aliyuncs.com}/${ACR_NAMESPACE:-certagent}/redis:${REDIS_TAG:-7-alpine}
    restart: unless-stopped
    # 性能/内存调优（4GB NAS 基线，可在 .env 用 REDIS_* 覆盖）
    # --maxmemory + volatile-lru：给内存设上限，满了只淘汰带 TTL 的缓存/会话 key，
    #   不影响无 TTL 的持久数据；--save '' 关闭 RDB 快照减少 NAS IO，保留 AOF 做持久化。
    command:
      - sh
      - -ec
      - |
        exec redis-server \
          --appendonly yes \
          --appendfsync ${REDIS_APPENDFSYNC:-everysec} \
          --requirepass "$$REDIS_PASSWORD" \
          --maxmemory ${REDIS_MAXMEMORY:-268435456} \
          --maxmemory-policy ${REDIS_MAXMEMORY_POLICY:-volatile-lru} \
          --save "" \
          --timeout ${REDIS_TIMEOUT:-300} \
          --tcp-keepalive 60
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    image: ${ACR_REGISTRY:-crpi-e8ivxiujwrjswkb4.cn-beijing.personal.cr.aliyuncs.com}/${ACR_NAMESPACE:-certagent}/${ACR_APP_REPO:-certagent}:${ACR_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-18080}:80"
    environment:
      TZ: Asia/Shanghai
      FNOS_DB_HOST: mysql
      FNOS_DB_PORT: "3306"
      FNOS_DB_NAME: ${DB_NAME:-cert_agent_fnos}
      FNOS_DB_USER: root
      FNOS_DB_PASS: ${DB_ROOT_PASSWORD:?请在 .env 中设置 DB_ROOT_PASSWORD}
      FNOS_REDIS_HOST: redis
      FNOS_REDIS_PORT: "6379"
      FNOS_REDIS_PASSWORD: ${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}
      FNOS_REDIS_DB: ${REDIS_DB:-0}
      FNOS_REDIS_PREFIX: ${REDIS_PREFIX:-cert:fnos:}
      FNOS_ADMIN_USER: ${ADMIN_USER:-admin}
      FNOS_ADMIN_PASS: ${ADMIN_PASS:?请在 .env 中设置 ADMIN_PASS}
      FNOS_ADMIN_NAME: ${ADMIN_NAME:-系统管理员}
      # 政务网申报密码加密密钥，安装后不可更换（更换会导致已保存密码无法解密）
      PHP_GOV_PASSWORD_KEY: ${GOV_PASSWORD_KEY:?请在 .env 中设置 GOV_PASSWORD_KEY}
      # 飞牛版关闭页面「在线升级」：代码在镜像层内，升级统一重建镜像
      PHP_UPGRADE_ENABLED: "0"
      # PHP-FPM 进程池（默认按 4GB NAS 调优；高规格 NAS 调大 PM_MAX_CHILDREN）
      FNOS_PM_MAX_CHILDREN: ${PM_MAX_CHILDREN:-12}
      FNOS_PM_START_SERVERS: ${PM_START_SERVERS:-4}
      FNOS_PM_MIN_SPARE_SERVERS: ${PM_MIN_SPARE_SERVERS:-2}
      FNOS_PM_MAX_SPARE_SERVERS: ${PM_MAX_SPARE_SERVERS:-6}
      FNOS_PM_MAX_REQUESTS: ${PM_MAX_REQUESTS:-500}
      # 定时任务调度器（单位秒）
      FNOS_SCHED_INTERVAL: ${SCHED_INTERVAL:-3600}
      FNOS_TASK_TIMEOUT_CHECK: ${TASK_TIMEOUT_CHECK:-900}
      FNOS_TASK_TIMEOUT_GOV: ${TASK_TIMEOUT_GOV:-1500}
    volumes:
      # 配置（.env）与安装锁在容器重建后保留
      - ./data/config:/data/config
      # 运行日志、备份、升级工作区、授权文件（runtime/vault）
      - ./data/runtime:/var/www/backend/runtime
      # 上传附件
      - ./data/uploads:/var/www/backend/public/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "/usr/local/bin/fnos-healthcheck.php"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  mysql_data:
  redis_data:

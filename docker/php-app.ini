; 应用运行参数（飞牛 fnOS 镜像内置）
; 单文件上限 20M；post_max_size 留出 multipart 开销，nginx client_max_body_size 与之对齐（24m）。
; post_max_size 必须略大于 upload_max_filesize，否则大附件会在 POST 阶段被丢弃。

memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 24M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000
date.timezone = Asia/Shanghai
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
realpath_cache_size = 4096K
realpath_cache_ttl = 600

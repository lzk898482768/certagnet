server {
    listen 80;
    server_name _;
    server_tokens off;
    root /var/www/backend/public;
    index index.php index.html;

    # 上传大小上限：单文件 PHP upload_max_filesize=20M，
    # 这里按 post_max_size=24M 留出 multipart 开销，避免 20MB 文件被 nginx 提前拒绝。
    client_max_body_size 24m;

    # gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_static on;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # 静态文件描述符缓存
    open_file_cache max=10000 inactive=30s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors off;

    # 长请求（导入导出 / 政务网同步）超时与 PHP max_execution_time=300 对齐
    fastcgi_connect_timeout 10s;
    fastcgi_send_timeout 300s;
    fastcgi_read_timeout 300s;
    fastcgi_buffer_size 32k;
    fastcgi_buffers 8 32k;
    fastcgi_busy_buffers_size 64k;
    # nginx 与 php-fpm 之间复用长连接，降低高并发下反复建连的开销
    fastcgi_keep_conn on;

    # 基础安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # 容器内健康检查（不经过 PHP，不受授权门禁影响）
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # 网页安装器在飞牛版中禁用：首次启动由 entrypoint 自动完成安装
    location = /install.php {
        return 404;
    }

    # 前端构建产物（PC）
    location /web/ {
        alias /var/www/backend/public/web/;
        try_files $uri $uri/ /web/index.html;
    }
    location = /web/index.html {
        alias /var/www/backend/public/web/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    location /web/assets/ {
        alias /var/www/backend/public/web/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 前端构建产物（移动端 H5）
    location /mobile/ {
        alias /var/www/backend/public/mobile/;
        try_files $uri $uri/ /mobile/index.html;
    }
    location = /mobile/index.html {
        alias /var/www/backend/public/mobile/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    location /mobile/assets/ {
        alias /var/www/backend/public/mobile/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 禁止访问隐藏文件、备份、SQL、日志等敏感资源
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }
    location ~* \.(env|ini|log|sql|bak|old|swp|git)$ {
        deny all;
        return 404;
    }

    # 后端接口与资源
    # 关键：用 ThinkPHP 官方「兼容模式」把原始路径放进 s 参数。
    # 框架 Request::pathinfo() 读取优先级为 $_GET['s'] > PATH_INFO > 其它，
    # 因此即使该环境 cgi.fix_pathinfo 关闭、PATH_INFO 取不到，也能稳定拿到路由，
    # 不会再把所有接口当成根路径而 302 跳 /web/。
    location / {
        try_files $uri $uri/ /index.php?s=$uri&$args;
    }

    # 上传目录纵深防御：脚本类扩展名一律拒绝执行
    location ^~ /uploads/ {
        location ~* \.(php|php3|php4|php5|php7|phtml|pht|jsp|jspx|asp|aspx|asax|sh|bash|cgi|pl|py|rb|exe|dll|bat|cmd|msi|ps1|shtml)$ {
            deny all;
            return 403;
        }
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # 显式解析 PATH_INFO：不依赖 PHP 的 cgi.fix_pathinfo 兜底。
    # 否则在该兜底失效的环境里，ThinkPHP 拿不到 pathinfo，会把所有请求
    # 当成根路径处理（接口全部 302 跳 /web/）。$fastcgi_path_info 由下方
    # 正则捕获的第二个捕获组提供。
    location ~ \.php(/|$) {
        # 防止 /uploads/xxx.jpg/evil.php 之类的路径解析绕过
        try_files $uri =404;
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300s;
    }

    location ~ /\.ht {
        deny all;
    }
}

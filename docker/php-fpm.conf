; php-fpm 池配置（飞牛 fnOS 镜像内置）
;
; clear_env = no：
;   官方 php:8.2-fpm 镜像默认已是 no；这里显式声明，避免基础镜像变化后失效。
;   安装器把数据库 / Redis / 政务网密钥写入 .env，ThinkPHP 的 env() 优先读取 .env；
;   当 .env 未定义某项时，env() 会回退读取 PHP_ 前缀的进程环境变量。
[www]
clear_env = no
; 动态进程模型，参数全部可经容器环境变量 / .env 覆盖（默认按 4GB NAS 调优）：
;   高规格 NAS（8/16GB）可调大 PM_MAX_CHILDREN（如 20/30）充分利用内存。
pm = dynamic
pm.max_children = ${FNOS_PM_MAX_CHILDREN}
pm.start_servers = ${FNOS_PM_START_SERVERS}
pm.min_spare_servers = ${FNOS_PM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${FNOS_PM_MAX_SPARE_SERVERS}
; 每个子进程处理若干请求后回收，缓解第三方库长期运行的内存泄漏
pm.max_requests = ${FNOS_PM_MAX_REQUESTS}

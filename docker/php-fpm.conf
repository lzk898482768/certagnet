; php-fpm 池配置（飞牛 fnOS 镜像内置）
;
; clear_env = no：
;   官方 php:8.2-fpm 镜像默认已是 no；这里显式声明，避免基础镜像变化后失效。
;   安装器把数据库 / Redis / 政务网密钥写入 .env，ThinkPHP 的 env() 优先读取 .env；
;   当 .env 未定义某项时，env() 会回退读取 PHP_ 前缀的进程环境变量。
[www]
clear_env = no
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

# nginx 主配置（main 层）—— 飞牛 fnOS 镜像内置
# 替换 Debian 默认 /etc/nginx/nginx.conf，使 worker_* 等 main 层指令处于正确上下文；
# server 块统一放在 /etc/nginx/conf.d/*.conf（本镜像为 default.conf）。
#
# 4GB NAS 基线；更高规格 NAS 可在重建镜像前调大 worker_connections。

# 不硬编码 user：Debian 官方 nginx 默认即 www-data（与 php-fpm 运行用户一致），
# 省略后由各镜像自身默认值决定，可同时通过 CI 的 nginx:alpine 校验与 Debian 运行环境。
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 高效文件传输与报文优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # keep-alive 长连接复用，减少频繁建连
    keepalive_timeout 65;
    keepalive_requests 1000;

    # 哈希表内存预留，避免主机名/类型增多时报 could not build hash
    server_names_hash_bucket_size 128;
    types_hash_max_size 2048;

    # 访问/错误日志：容器内软链到标准输出，由 Docker 收集
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # 各 server（含业务站点）配置
    include /etc/nginx/conf.d/*.conf;
}

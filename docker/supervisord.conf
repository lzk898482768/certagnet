[supervisord]
nodaemon = true
user = root
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /run/supervisord.pid
childlogdir = /tmp

[program:php-fpm]
command = php-fpm -F
priority = 10
autorestart = true
startsecs = 3
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true

[program:nginx]
command = nginx -g "daemon off;"
priority = 20
autorestart = true
startsecs = 3
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true

[program:scheduler]
command = /usr/local/bin/fnos-scheduler.sh
user = www-data
priority = 30
autorestart = true
startsecs = 5
stopasgroup = true
killasgroup = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
redirect_stderr = true
